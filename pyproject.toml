[tool.black]
line-length = 120

[project]
name = "boogie-stats"
version = "0.1.0"
description = "A pass-through proxy for groovestats.com that records non-ranked song scores"
authors = [
    {name = "Rafał Florczak", email="florczak.raf+boogiestats@gmail.com"}
]
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django (~=5.2)",
    "requests (~=2.34)",
    "gunicorn (~=26.1)",
    "django-mathfilters (~=1.0)",
    "redis (~=8.1)",
    "sentry-sdk (~=2.68)",
    "django-bootstrap-icons (==0.9.0)",
    "django-prometheus (~=2.5)",
    "prometheus-client (~=0.26)",
    "django-ipware (~=8.0)",
    "django-formset (~=2.2)",
    "tenacity (>=9.1.4,<10.0.0)",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-django>=4.14,<5",
    "requests-mock>=1.12.1,<2",
    "pre-commit>=4.7,<5",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "boogiestats"
module-root = ""

[tool.isort]
profile = "black"

[tool.djlint]
ignore = "H021,H052"
